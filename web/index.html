<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spectral Hollow</title>
<meta name="description" content="Spectral partitioning explained on a rainy Halloween night: a pixel-art village, then 66 years of real arms-trade data from SIPRI.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Nunito:wght@600;700;800;900&family=Pixelify+Sans:wght@500;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--u:19.2px;--pump:#ff8c32;--ghost:#6af0d0;--witch:#b58cff;--candy:#ffd84d;--warm:#ffcf6a;--sell:#ff5f9e;--buy:#7cc8ff;--cut:#ff4a5a;--ink:#05060c;--text:#eef0ff;--dim:#a3acd8;--edge:#283067}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink);color:var(--text);overflow:hidden;font-family:Nunito,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
b{font-weight:900}
.o{color:var(--pump)}.g{color:var(--ghost)}.w{color:var(--warm)}.s{color:var(--sell)}.b{color:var(--buy)}.v{color:var(--witch)}.r{color:var(--cut)}

#stage{position:absolute;overflow:hidden;background:#05060c;touch-action:manipulation}
#px{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
#svg,#labels{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:58}

/* ---------- labels & callouts ---------- */
.lb{position:absolute;white-space:nowrap;font:400 calc(var(--u)*.66)/1 Silkscreen,monospace;color:#fff;text-shadow:0 1px 0 #000,0 0 6px #000;transform:translate(-50%,-100%)}
.tagn{background:#eef0ff;color:#0a0c1c;text-shadow:none;padding:.18em .38em;animation:pop .45s cubic-bezier(.2,1.7,.4,1) both}
@keyframes pop{from{transform:translate(-50%,-100%) scale(0)}to{transform:translate(-50%,-100%) scale(1)}}
.co{padding:.4em .65em;background:rgba(8,10,24,.92);box-shadow:inset 0 0 0 1.5px var(--ghost);font:800 calc(var(--u)*.8)/1.25 Nunito;color:#fff;text-shadow:none;white-space:normal;width:max-content;max-width:calc(var(--u)*17)}
.co.o{box-shadow:inset 0 0 0 1.5px var(--pump)}.co.r{box-shadow:inset 0 0 0 1.5px var(--cut)}.co.v{box-shadow:inset 0 0 0 1.5px var(--witch)}.co.y{box-shadow:inset 0 0 0 1.5px var(--candy)}
#svg .co-line{fill:none;stroke:var(--ghost);stroke-width:.42}
#svg .co-dot{fill:none;stroke:var(--ghost);stroke-width:.55;transform-box:fill-box;transform-origin:center}
#svg .o{stroke:var(--pump)}#svg .r{stroke:var(--cut)}#svg .v{stroke:var(--witch)}#svg .y{stroke:var(--candy)}
#bigYear{position:absolute;left:2.2%;top:11%;pointer-events:none;display:none;z-index:19}
#bigYear .yy{display:flex;overflow:hidden;font:400 calc(var(--u)*3.3)/1 Anton,Impact,sans-serif;color:#fff;letter-spacing:.02em;text-shadow:0 3px 0 #000}
#bigYear .yy b{display:block;font-weight:400}
#bigYear small{display:block;font:400 calc(var(--u)*.62)/1.2 Silkscreen,monospace;color:var(--dim);letter-spacing:.1em;margin-top:.2em}

/* ---------- HUD ---------- */
#hud{position:absolute;top:2.2%;left:1.5%;right:1.5%;display:flex;align-items:center;justify-content:space-between;z-index:25;pointer-events:none;opacity:0;transition:opacity .6s}
#hud.on{opacity:1}#hud.on>*{pointer-events:auto}
#logo{display:flex;align-items:center;gap:calc(var(--u)*.55);font:700 calc(var(--u)*.9)/1 Silkscreen,monospace;letter-spacing:.08em;color:#fff;text-shadow:0 2px 0 #000;cursor:default}
#logo canvas{width:calc(var(--u)*1.8);height:calc(var(--u)*1.6);image-rendering:pixelated}
.hbtns{display:flex;gap:calc(var(--u)*.5)}

/* ---------- buttons ---------- */
.btn{cursor:pointer;border:0;font:700 calc(var(--u)*.88)/1 'Pixelify Sans',monospace;padding:calc(var(--u)*.55) calc(var(--u)*.95);background:#232a55;color:#e8ebff;box-shadow:0 0 0 calc(var(--u)*.14) #0a0c1c,inset 0 calc(var(--u)*-.2) 0 rgba(0,0,0,.35);transition:transform .08s,filter .15s;white-space:nowrap;user-select:none}
.btn:hover{filter:brightness(1.3)}.btn:active{transform:translateY(2px)}
.btn.go{background:var(--pump);color:#1d0d02}
.btn.mint,.btn.on{background:var(--ghost);color:#04201a}
.btn.go.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 calc(var(--u)*.14) #0a0c1c,0 0 calc(var(--u)*1.5) rgba(255,140,50,.9)}}
.btn:disabled{opacity:.3;cursor:default;filter:none}
.btn.sm{font-size:calc(var(--u)*.78);padding:calc(var(--u)*.45) calc(var(--u)*.75)}

/* ---------- dialogue box (RPG style, full width) ---------- */
#box{position:absolute;left:1.5%;right:1.5%;bottom:2.4%;z-index:20;display:grid;grid-template-columns:auto minmax(0,1.3fr) minmax(0,1fr);gap:calc(var(--u)*1.3);align-items:stretch;padding:calc(var(--u)*1.05) calc(var(--u)*1.3) calc(var(--u)*.95);background:rgba(9,10,26,.86);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);border:calc(var(--u)*.2) solid #d9defa;box-shadow:0 0 0 calc(var(--u)*.2) #070814,inset 0 0 0 calc(var(--u)*.2) var(--edge),0 calc(var(--u)*.5) calc(var(--u)*2.5) rgba(0,0,0,.55);transition:opacity .45s,transform .45s}
#box.off{opacity:0;transform:translateY(24px);pointer-events:none}
#box .tag{position:absolute;left:calc(var(--u)*1.2);top:calc(var(--u)*-1.4);background:var(--ghost);color:#04201a;font:400 calc(var(--u)*.7)/1 Silkscreen,monospace;padding:calc(var(--u)*.32) calc(var(--u)*.7);box-shadow:0 0 0 calc(var(--u)*.2) #070814;letter-spacing:.06em}
#boo{width:calc(var(--u)*5.2);height:calc(var(--u)*5.2);image-rendering:pixelated;background:radial-gradient(circle,#173a4c,#0b0f24 72%);box-shadow:inset 0 0 0 calc(var(--u)*.14) var(--edge)}
.bx{min-width:0}
.bx-head{display:flex;align-items:center;gap:calc(var(--u)*.7);margin-bottom:calc(var(--u)*.45)}
.bx-step{font:400 calc(var(--u)*.64)/1 Silkscreen,monospace;letter-spacing:.04em;color:var(--dim);white-space:nowrap}
.bx-title{color:#fff;font:400 calc(var(--u)*1.38)/1.05 Anton,Impact,sans-serif;letter-spacing:.02em;text-transform:uppercase}
.pips{display:flex;gap:calc(var(--u)*.22);margin-left:auto}.pips i{width:calc(var(--u)*.85);height:calc(var(--u)*.3);background:var(--edge);transition:background .3s}.pips i.done{background:#4b5aa0}.pips i.on{background:var(--ghost)}
.bx-text{font:700 calc(var(--u)*1.05)/1.46 Nunito;color:#eef0ff;min-height:4.4em;cursor:pointer}
.bx-text .h{visibility:hidden}
.bx-math{margin-top:calc(var(--u)*.45);font:600 calc(var(--u)*.74)/1.35 Nunito;color:var(--dim)}
.bx-math::before{content:'🧠 Math words: ';color:var(--witch);font-weight:900}
.bx-math i{color:#dccfff;font-style:normal;font-weight:800}
.bx-side{display:flex;flex-direction:column;gap:calc(var(--u)*.7);min-width:0}
.bx-tools{display:flex;flex-wrap:wrap;gap:calc(var(--u)*.55);align-items:center;align-content:flex-start;flex:1}
.bx-nav{display:flex;gap:calc(var(--u)*.6);justify-content:flex-end;align-items:center}
.bx-nav .kb{margin-right:auto;font:400 calc(var(--u)*.6) Silkscreen,monospace;color:#59639a}
.hint{font:800 calc(var(--u)*.8)/1.25 Nunito;color:var(--warm)}
.stat{display:flex;align-items:center;gap:calc(var(--u)*.45);background:rgba(40,48,103,.35);padding:calc(var(--u)*.32) calc(var(--u)*.7);box-shadow:inset 0 0 0 1px var(--edge)}
.stat b{font:400 calc(var(--u)*1.65)/1 Anton,Impact,sans-serif;color:#fff;min-width:1ch;display:inline-block}
.stat span{font:800 calc(var(--u)*.62)/1.15 Nunito;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
.stat.cut b{color:var(--cut)}.stat.okk b{color:var(--ghost)}
.seg{display:flex;box-shadow:0 0 0 calc(var(--u)*.14) #0a0c1c}.seg .btn{box-shadow:none}
.cmp{display:grid;grid-template-columns:auto 1fr auto;gap:calc(var(--u)*.3) calc(var(--u)*.6);align-items:center;flex:1;min-width:calc(var(--u)*17);font:800 calc(var(--u)*.72) Nunito;color:var(--dim)}
.cmp i{height:calc(var(--u)*.8);display:block;width:var(--w);transition:width .9s cubic-bezier(.2,1.2,.3,1)}
.cmp i.o{background:var(--pump)}.cmp i.g{background:#5d6aa8}
.cmp b{font:400 calc(var(--u)*1.05) Anton,Impact,sans-serif;color:#fff}
.badge{font:400 calc(var(--u)*2.3)/1 Anton,Impact,sans-serif;color:var(--candy);text-shadow:0 3px 0 #000;display:inline-block}
.yr{display:flex;align-items:center;gap:calc(var(--u)*.55);flex:1 1 100%}
.yr input{flex:1;accent-color:var(--pump);height:calc(var(--u)*1.1);cursor:pointer}
.yr span{font:400 calc(var(--u)*.68) Silkscreen,monospace;color:var(--dim);min-width:6.5em}
.leg{display:flex;flex-wrap:wrap;gap:calc(var(--u)*.35) calc(var(--u)*.9);font:800 calc(var(--u)*.74) Nunito;color:#dfe3ff;width:100%}
.leg span{display:flex;align-items:center;gap:.4em}.leg i{width:.8em;height:.8em;display:inline-block}
.leg i.mid{background:transparent;box-shadow:0 0 0 2px #f4ecff;width:.55em;height:.55em;margin:0 .12em}
.meq{display:flex;align-items:flex-end;gap:calc(var(--u)*.22);height:calc(var(--u)*2.6);padding:0 calc(var(--u)*.3)}
.meq>i{width:calc(var(--u)*.62);position:relative;display:block;transition:height .5s}
.meq i.gh{position:absolute;left:0;bottom:0;width:100%;background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.6)}
.meq-l{font:800 calc(var(--u)*.6)/1.2 Nunito;color:var(--dim);max-width:9em}
select.pick{font:800 calc(var(--u)*.85) Nunito;background:#141836;color:#fff;border:0;box-shadow:0 0 0 calc(var(--u)*.14) #0a0c1c,inset 0 0 0 1px var(--edge);padding:calc(var(--u)*.4) calc(var(--u)*.6);cursor:pointer;max-width:14em}
.info{width:100%;font:700 calc(var(--u)*.8)/1.45 Nunito;color:#dfe3ff}
.info .nm{font:400 calc(var(--u)*1.45)/1.05 Anton,Impact,sans-serif;color:#fff;letter-spacing:.02em;margin-right:.35em}
.chip{display:inline-block;font:800 calc(var(--u)*.66)/1 Nunito;padding:.3em .55em;color:#0a0c1c;vertical-align:middle;margin-right:.3em}
.prt{display:flex;flex-wrap:wrap;gap:.1em .9em;margin-top:.2em;font-size:.94em}

/* ---------- chapter card ---------- */
#chap{position:absolute;left:3.2%;top:12%;z-index:30;pointer-events:none;display:none}
#chap .cn{display:flex;overflow:hidden;font:400 calc(var(--u)*7.4)/.92 Anton,Impact,sans-serif;color:transparent;-webkit-text-stroke:calc(var(--u)*.11) #fff}
#chap .cn b{display:block;font-weight:400}
#chap .cn b:last-child{color:var(--pump);-webkit-text-stroke:0}
#chap .cbar{height:calc(var(--u)*.42);width:calc(var(--u)*24);background:linear-gradient(90deg,var(--ghost),var(--pump));transform-origin:left;margin:calc(var(--u)*.5) 0 calc(var(--u)*.6)}
#chap .ct{font:400 calc(var(--u)*3.1)/1.02 Anton,Impact,sans-serif;text-transform:uppercase;color:#fff;letter-spacing:.01em;text-shadow:0 calc(var(--u)*.2) 0 rgba(0,0,0,.6);max-width:calc(var(--u)*46)}
#chap .ct span{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .04em .06em}
#chap .ct i{display:inline-block;font-style:normal}
#chap .ck{font:400 calc(var(--u)*.75)/1 Silkscreen,monospace;letter-spacing:.3em;color:var(--ghost);margin-top:calc(var(--u)*.7)}

/* ---------- intro ---------- */
#intro{position:fixed;inset:0;z-index:60}
#inBg{position:absolute;inset:0;background:#05060c}
#inFg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
#inScrim{position:absolute;inset:0;background:radial-gradient(ellipse 58% 52% at 50% 50%,rgba(5,6,12,.82),rgba(5,6,12,.35) 70%,rgba(5,6,12,0));opacity:0}
.in-kick{position:relative;font:400 clamp(11px,1vw,17px) Silkscreen,monospace;letter-spacing:.38em;color:var(--ghost);opacity:0}
.in-t1{position:relative;font:400 clamp(64px,12.5vw,230px)/.92 Anton,Impact,sans-serif;letter-spacing:.02em;color:#fff;display:flex;overflow:hidden;padding:.02em .05em 0;text-shadow:0 0 50px rgba(106,240,208,.3);transform-origin:left top}
.in-t1 span{display:inline-block;transform:translateY(108%)}
.in-t2{position:relative;font:700 clamp(38px,7vw,128px)/1 'Pixelify Sans';letter-spacing:.2em;color:var(--pump);margin:.04em 0 0 .2em;opacity:0;text-shadow:0 0 30px rgba(255,140,50,.45)}
.in-t2::before,.in-t2::after{content:attr(data-t);position:absolute;inset:0;mix-blend-mode:screen;clip-path:inset(0 0 100% 0)}
.in-t2::before{color:var(--ghost)}.in-t2::after{color:#ff3d7f}
.in-t2.gl::before{animation:gl1 .75s steps(1) both}.in-t2.gl::after{animation:gl2 .75s steps(1) both}
@keyframes gl1{0%{clip-path:inset(8% 0 62% 0);transform:translate(-10px,0)}17%{clip-path:inset(58% 0 12% 0);transform:translate(7px,0)}34%{clip-path:inset(30% 0 44% 0);transform:translate(-6px,0)}51%{clip-path:inset(78% 0 4% 0);transform:translate(5px,0)}68%{clip-path:inset(2% 0 84% 0);transform:translate(-3px,0)}85%{clip-path:inset(44% 0 40% 0);transform:translate(2px,0)}100%{clip-path:inset(0 0 100% 0);transform:none}}
@keyframes gl2{0%{clip-path:inset(64% 0 8% 0);transform:translate(10px,0)}17%{clip-path:inset(12% 0 70% 0);transform:translate(-8px,0)}34%{clip-path:inset(46% 0 30% 0);transform:translate(6px,0)}51%{clip-path:inset(4% 0 80% 0);transform:translate(-4px,0)}68%{clip-path:inset(70% 0 12% 0);transform:translate(3px,0)}85%{clip-path:inset(20% 0 66% 0);transform:translate(-2px,0)}100%{clip-path:inset(0 0 100% 0);transform:none}}
.in-line{position:relative;width:min(560px,52vw);height:3px;background:linear-gradient(90deg,transparent,var(--ghost),var(--pump),transparent);transform:scaleX(0);margin:1.1em 0 1em}
.in-sub{position:relative;font:800 clamp(15px,1.45vw,26px)/1.45 Nunito;color:#e4e8ff;max-width:32em;opacity:0}
.in-btns{position:relative;display:flex;gap:18px;margin-top:1.7em;flex-wrap:wrap;justify-content:center}
.btn.big{font-size:clamp(15px,1.3vw,24px);padding:.85em 1.4em;display:flex;flex-direction:column;align-items:center;gap:.35em;opacity:0;--u:12px}
.btn.big small{font:800 .6em Nunito;opacity:.8}
.in-foot{position:absolute;bottom:3.5%;left:0;right:0;font:400 clamp(10px,.75vw,13px) Silkscreen,monospace;letter-spacing:.14em;color:#6c77aa;opacity:0}
.skip{position:absolute;bottom:3.5%;right:3%;font:400 clamp(10px,.75vw,13px) Silkscreen,monospace;letter-spacing:.14em;color:#48507c}

/* ---------- outro ---------- */
#outro{position:fixed;inset:0;z-index:56;display:none;background:radial-gradient(ellipse at center,rgba(5,6,12,.72),rgba(5,6,12,.95));overflow:hidden}
#outro.on{display:block}
.recap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(860px,90vw);display:grid;gap:18px}
.recap div{display:flex;gap:18px;align-items:center;font:800 clamp(17px,1.7vw,30px)/1.3 Nunito;color:#fff;opacity:0}
.recap b.n{font:400 clamp(34px,3.4vw,62px)/1 Anton,Impact,sans-serif;color:var(--pump);min-width:1.2em}
.o-btns{position:absolute;bottom:0;left:0;right:0;padding:60px 16px 5vh;background:linear-gradient(rgba(5,6,12,0),rgba(5,6,12,.96) 45%);display:flex;justify-content:center;gap:16px;flex-wrap:wrap;opacity:0;pointer-events:none;--u:14px}
.o-btns.on{opacity:1;pointer-events:auto;transition:opacity .6s}
.o-btns .btn{font-size:17px;padding:.8em 1.2em}

/* ---------- 3D globe ---------- */
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:14;opacity:0;pointer-events:none;transition:opacity .7s}#sky.on{opacity:1}
#globeWrap{position:absolute;left:0;top:0;width:100%;height:72%;z-index:15;opacity:0;pointer-events:none;transform:scale(.55);transition:opacity .7s,transform 1.1s cubic-bezier(.2,1.2,.3,1)}
#globeWrap.on{opacity:1;pointer-events:auto;transform:none}
#globe canvas{image-rendering:pixelated;cursor:grab}
#globe canvas:active{cursor:grabbing}
#gpins{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.gpin{position:absolute;left:0;top:0;--c:var(--ghost);transition:opacity .3s;will-change:transform}
.gpin.o{--c:var(--pump)}.gpin.v{--c:var(--witch)}
.gpin i{position:absolute;left:-6px;top:-6px;width:12px;height:12px;box-shadow:inset 0 0 0 2px var(--c);transform:rotate(45deg)}
.gpin em{position:absolute;left:6px;top:-1px;width:calc(var(--u)*2);height:2px;background:var(--c);transform-origin:left}
.gpin span{position:absolute;left:calc(var(--u)*2 + 6px);top:0;transform:translateY(-50%);white-space:nowrap;background:rgba(8,10,24,.92);box-shadow:inset 0 0 0 1.5px var(--c);padding:.35em .6em;font:800 calc(var(--u)*.78)/1.2 Nunito;color:#fff}
.gpin.in em{animation:pinLine .3s cubic-bezier(.6,0,.2,1) both}.gpin.in span{animation:pinIn .5s .2s cubic-bezier(.6,0,.2,1) both}
@keyframes pinLine{from{transform:scaleX(0)}to{transform:none}}
@keyframes pinIn{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.scene-tooltip,.float-tooltip-kap{background:none!important;padding:0!important;border-radius:0!important}
.gtip{font:400 calc(var(--u)*.72)/1.3 Silkscreen,monospace;background:#eef0ff;color:#0a0c1c;padding:.35em .6em;box-shadow:0 0 0 2px #0a0c1c}
.gtip small{display:block;font:700 calc(var(--u)*.62) Nunito;color:#4b5aa0}

/* ---------- phone (portrait) ---------- */
body.portrait #box{position:fixed;left:8px;right:8px;top:calc(var(--sb) + 26px);bottom:auto;grid-template-columns:1fr;gap:10px;max-height:calc(100vh - var(--sb) - 34px);overflow:auto;--u:12.5px}
body.portrait #boo{display:none}
body.portrait #hud{--u:9px}body.portrait #chap{--u:5.5px}
body.portrait .bx-nav .kb{display:none}
@media (prefers-reduced-motion:reduce){.btn.go.pulse{animation:none}}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="stage">
  <canvas id="px"></canvas>
  <svg id="svg" viewBox="0 0 480 270" preserveAspectRatio="none"></svg>
  <div id="labels"></div>
  <div id="globeWrap"><div id="globe"></div><div id="gpins"></div></div>
  <div id="bigYear"><div class="yy" id="yy"></div><small id="yyw"></small></div>
  <div id="hud">
    <div id="logo"><canvas id="logoC" width="18" height="16"></canvas><span>SPECTRAL HOLLOW</span></div>
    <div class="hbtns">
      <button class="btn sm" id="hSound" title="Rain and fire sounds (S)">🔈 Sound off</button>
      <button class="btn sm" id="hFull" title="Full screen (F)">⛶</button>
    </div>
  </div>
  <div id="chap"></div>
  <div id="box" class="off">
    <div class="tag">BOO THE GHOST</div>
    <canvas id="boo" width="20" height="20"></canvas>
    <div class="bx">
      <div class="bx-head"><span class="bx-step" id="bStep"></span><span class="bx-title" id="bTitle"></span><div class="pips" id="pips"></div></div>
      <div class="bx-text" id="bText" title="Click to show it all"></div>
      <div class="bx-math" id="bMath"></div>
    </div>
    <div class="bx-side">
      <div class="bx-tools" id="bTools"></div>
      <div class="bx-nav"><span class="kb">← → keys work too</span><button class="btn" id="bBack">◀ Back</button><button class="btn go" id="bNext">Next ▶</button></div>
    </div>
  </div>
</div>
<canvas id="fx"></canvas>

<div id="intro">
  <div id="inBg"></div>
  <div id="inFg">
    <div id="inScrim"></div>
    <div class="in-kick" id="inKick">A GRAPH MINING STORY</div>
    <h1 class="in-t1" id="inT1"></h1>
    <div class="in-t2" id="inT2" data-t="HOLLOW">HOLLOW</div>
    <div class="in-line" id="inLine"></div>
    <p class="in-sub" id="inSub">How a computer finds <span class="g">teams</span> hiding in a network. First a tiny village, then the whole world on a 3D globe.</p>
    <div class="in-btns">
      <button class="btn big go" id="bStart">▶ Start the story<small>8 tiny steps · about 4 minutes</small></button>

  team=SPEC_TEAM.slice();setAll({graph:1,ropes:1,ropeDraw:1,wobble:0,eq:0,world:0,dim:0});V.team=0;V.markers=0;V.cut=0;tw('lineup',1,.3);lineT0=T;lineStack=null;
  const strike=()=>later(()=>{flash();shake();tw('team',1,.3);tw('markers',1,.4);tw('cut',1,.5,EZ.out,.3);if(AU)AU.zap();
    label(112,LINE_Y+15,'− sank','g');label(240,LINE_Y+15,'0 = the cut');label(368,LINE_Y+15,'+ floated','o');
    const el=$('#sComp');el.textContent=cutCount(EDGES,SPEC_TEAM);el.animate([{transform:'scale(1.6)'},{transform:'scale(1)'}],{duration:400,easing:'cubic-bezier(.2,1.6,.4,1)'})},STRIKE*1000);
  $('#bTools').innerHTML=`<div class="stat okk"><b id="sComp">?</b><span>ropes cut by<br>the computer</span></div><div class="stat"><b>${OPT}</b><span>fewest<br>possible</span></div><button class="btn sm" id="bReplay">⚡ Replay</button><div class="hint">The same good split as before, found without guessing.</div>`;
  $('#bReplay').onclick=()=>{clearLater();clearOverlays();lineT0=T;V.team=0;V.markers=0;V.cut=0;$('#sComp').textContent='?';strike()};strike()},
 ()=>{ // 5. the shuffle test
  team=SPEC_TEAM.slice();setAll({graph:1,ropes:1,ropeDraw:1,team:1,markers:1,lineup:0,world:0,dim:0,cut:0,eq:0});tw('wobble',1,.9,EZ.out);wobT0=T;
  $('#bTools').innerHTML=`<div class="seg"><button class="btn sm on" id="gReal">🏡 Real village</button><button class="btn sm" id="gShuf">🎲 Shuffled</button></div><button class="btn sm" id="gAgain">↻ Shuffle again</button>
   <div class="cmp"><span>Real jump</span><i class="o" style="--w:0%" id="cR"></i><b>${SPEC.jump.toFixed(2)}</b><span>Shuffled (avg of 100)</span><i class="g" style="--w:0%" id="cS"></i><b>${SHUF_MEAN.toFixed(2)}</b></div><span class="badge" id="cB">×${RATIO_V.toFixed(1)}</span>`;
  const ui=()=>{$('#gReal').classList.toggle('on',graphMode==='real');$('#gShuf').classList.toggle('on',graphMode==='shuf')};
  $('#gReal').onclick=()=>{if(graphMode!=='real'){setGraph('real');ui()}};
  $('#gShuf').onclick=()=>{if(graphMode!=='shuf'){setGraph('shuf');ui()}};
  $('#gAgain').onclick=()=>{shufSeedIx++;setGraph('shuf');ui()};
  later(()=>{$('#cR').style.setProperty('--w','100%');$('#cS').style.setProperty('--w',(SHUF_MEAN/SPEC.jump*100).toFixed(0)+'%');$('#cB').animate([{transform:'scale(0) rotate(-20deg)'},{transform:'scale(1.3) rotate(4deg)'},{transform:'scale(1)'}],{duration:700,easing:'cubic-bezier(.2,1.5,.4,1)',fill:'backwards'})},500);
  later(()=>{setGraph('shuf');ui();const[x,y]=peakOf(3);callout(x,y-4,-40,-42,'Now the teams are mixed up across both hills',0,'o')},2600)},
 ()=>{ // 6. the real world
  setAll({graph:0,ropes:1,ropeDraw:1,team:0,markers:0,wobble:0,lineup:0,eq:0,cut:0,world:1,dim:1});
  $('#bigYear').style.display='block';worldTools(false)},
 ()=>{ // 7. pick a country
  setAll({graph:0,ropes:1,ropeDraw:1,team:0,markers:0,wobble:0,lineup:0,eq:0,cut:0,world:1,dim:1});
  $('#bigYear').style.display='block';worldTools(true)}];
function eqLabels(){LB.querySelectorAll('.eqn').forEach(e=>e.remove());for(let i=0;i<8;i++)label(EQX+i*24+7,EQB+8,String(i+1),'eqn');const t=label(EQX+96,20,graphMode==='shuf'?'SHUFFLED VILLAGE · dotted outline = real':'HOW SLOW IS EACH WOBBLE?','eqn');t.style.color=graphMode==='shuf'?'#ffb0c8':'#cfd6ff'}
function worldTools(pick){
  if(!DATA){$('#bTools').innerHTML='<div class="hint">Loading 75 years of real weapons deals…</div>';later(()=>{if(STEP>=5)worldTools(pick)},400);return}
  $('#bTools').innerHTML=`<div class="yr"><button class="btn sm go" id="wPlay">▶</button><input type="range" id="wYear" min="1959" max="2025" value="${YEAR}" aria-label="year"><span id="wWin"></span></div>
   ${pick?`<select class="pick" id="wPick" aria-label="country"></select><div class="info" id="wInfo"></div>`:`<div class="stat"><b id="wRatio">–</b><span>bigger jump than<br>shuffled worlds</span></div><div class="leg" id="wLeg"></div><div class="hint">🖱 Drag to spin · scroll to zoom · click a dot</div>`}`;
  $('#wPlay').onclick=()=>PLAY?stopPlay():startPlay();
  $('#wYear').oninput=e=>{stopPlay();YEAR=+e.target.value;updateYear()};
  document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{KMODE=+b.dataset.k;document.querySelectorAll('[data-k]').forEach(x=>x.classList.toggle('on',x===b));updateYear()});
  if(pick)$('#wPick').onchange=e=>{SEL=e.target.value;updateYear();focusSel();selPin(true)};
  updateYear(true);showGlobe(true);if(!pick)countUp($('#wRatio'),ratioOf(frameOf(YEAR)),900,0,'×')}
const ratioOf=fr=>fr.stats.gap2/fr.random.gap_mean['2'];
function updateYear(first){const fr=frameOf(YEAR);if(!fr)return;
  const yw=$('#wWin');if(yw)yw.textContent=`${YEAR-9} – ${YEAR}`;const ys=$('#wYear');if(ys&&+ys.value!==YEAR)ys.value=YEAR;
  const yy=$('#yy'),str=String(YEAR),old=yy.dataset.v||'';yy.innerHTML=[...str].map(c=>`<b>${c}</b>`).join('');
  if(!first)[...yy.children].forEach((b,i)=>{if(old[i]!==str[i])b.animate([{transform:'translateY(100%)',opacity:0},{transform:'none',opacity:1}],{duration:380,easing:'cubic-bezier(.2,1.4,.3,1)'})});
  yy.dataset.v=str;$('#yyw').textContent=`DEALS FROM ${YEAR-9}–${YEAR}`;
  const r=$('#wRatio');if(r&&!first)r.textContent=ratioOf(fr).toFixed(0)+'×';
  const eq=$('#wEq');if(eq)eq.innerHTML=fr.eig.slice(0,8).map((v,i)=>{const h=4+v*90,hr=4+fr.random.eig[i]*90;return`<i style="height:${h.toFixed(0)}%;background:${i<2?'var(--ghost)':'#5d6aa8'}"><i class="gh" style="height:${(hr/h*100).toFixed(0)}%"></i></i>`}).join('');
  const lg=$('#wLeg');if(lg){const nm=fr.names[String(KMODE)],cols=['var(--ghost)','var(--pump)','var(--witch)','var(--candy)'],ic=['👻','🎃','🧙','🍬'];
    lg.innerHTML=Object.keys(nm).sort().map(k=>`<span><i style="background:${cols[k]}"></i>${ic[k]} Team ${nm[k]}</span>`).join('')+`<span><i style="background:#f4ecff"></i>✦ middlemen (white dots)</span>`}
  const pk=$('#wPick');if(pk){const ids=fr.nodes.map(n=>n.id).sort();if(!ids.includes(SEL))ids.unshift(SEL);pk.innerHTML=ids.map(i=>`<option ${i===SEL?'selected':''}>${i}</option>`).join('');infoCard()}
  globeData();if(!first){worldPins(false);selPin(false)}}
function infoCard(){const el=$('#wInfo');if(!el)return;const fr=frameOf(YEAR),n=nidx(fr)[SEL];
  if(!n){el.innerHTML=`<span class="nm">${SEL}</span> made no big weapons deals in ${YEAR-9}–${YEAR}. Try another year.`;return}
  const nm=fr.names['2'],tcol=n.c2===0?'var(--ghost)':'var(--pump)',cross=Math.round(n.cr*100);
  const parts=n.tp.slice(0,6).map(([p,v,d])=>`<span class="${d==='out'?'s':'b'}">${d==='out'?'→ sells to':'← buys from'} <b>${p}</b></span>`).join('');
  el.innerHTML=`<span class="nm">${n.id}</span><span class="chip" style="background:${tcol}">${n.c2===0?'👻':'🎃'} Team ${nm[n.c2]}</span>${n.br?'<span class="chip" style="background:#f4ecff">✦ middleman</span>':''}
   <div>Sold <b class="s">${fmt(n.ex)}</b> · bought <b class="b">${fmt(n.im)}</b> weapon points · <b>${cross}%</b> of its trade crosses to the other team${n.br?', so it is a <b class="v">middleman</b>.':cross<15?': very loyal to its team.':'.'}</div><div class="prt">${parts}</div>`}
function startPlay(){if(YEAR>=2025)YEAR=1959;$('#wPlay').textContent='❚❚';PLAY=setInterval(()=>{if(YEAR>=2025){stopPlay();return}YEAR++;updateYear()},650)}
function stopPlay(){if(PLAY){clearInterval(PLAY);PLAY=null}const b=$('#wPlay');if(b)b.textContent='▶'}

$('#bNext').onclick=()=>goStep(STEP+1);$('#bBack').onclick=()=>goStep(STEP-1);
$('#bText').onclick=()=>finishType();

/* =====================================================================
   INTRO  ·  OUTRO
   ===================================================================== */
const introAnims=[],TO2=[];let introDone=false;
function later2(fn,ms){TO2.push(setTimeout(fn,ms))}
function A(el,kf,o){const a=el.animate(kf,{fill:'both',...o});introAnims.push(a);return a}
function runIntro(){const t1=$('#inT1');t1.innerHTML=[...'SPECTRAL'].map(c=>`<span>${c}</span>`).join('');
  A($('#inKick'),[{opacity:0,letterSpacing:'1.2em'},{opacity:1,letterSpacing:'.38em'}],{duration:900,delay:100,easing:'cubic-bezier(.2,.8,.2,1)'});
  t1.querySelectorAll('span').forEach((s,i)=>A(s,[{transform:'translateY(108%)'},{transform:'none'}],{duration:760,delay:350+i*60,easing:'cubic-bezier(.2,1.35,.3,1)'}));
  later2(()=>{$('#inT2').classList.add('gl');ringBurst(innerWidth/2,innerHeight*.45,['#6af0d0','#ff8c32','#ffffff'],Math.max(innerWidth,innerHeight)*.45)},950);
  A($('#inT2'),[{opacity:0,transform:'scale(1.25)'},{opacity:1,transform:'none'}],{duration:500,delay:950,easing:'cubic-bezier(.2,1.4,.3,1)'});
  A($('#inLine'),[{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{duration:800,delay:1300,easing:'cubic-bezier(.7,0,.2,1)'});
  A($('#inScrim'),[{opacity:0},{opacity:1}],{duration:900,delay:1500});
  A($('#inSub'),[{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],{duration:700,delay:1750,easing:'ease-out'});
  document.querySelectorAll('.btn.big').forEach((b,i)=>A(b,[{opacity:0,transform:'translateY(18px) scale(.9)'},{opacity:1,transform:'none'}],{duration:600,delay:2150+i*120,easing:'cubic-bezier(.2,1.4,.3,1)'}));
  A($('#inFoot'),[{opacity:0},{opacity:1}],{duration:800,delay:2400});
  A($('#inSkip'),[{opacity:1},{opacity:0}],{duration:400,delay:2600});
  // an iris opens from the centre to reveal the diorama
  const bg=$('#inBg'),ts=performance.now()+1450,R=Math.hypot(innerWidth,innerHeight)/2+10;
  const iris=now=>{const p=clamp((now-ts)/1300),r=EZ.inOut(p)*R,m=`radial-gradient(circle at 50% 50%, transparent ${r}px, #000 ${r+1.5}px)`;bg.style.webkitMaskImage=m;bg.style.maskImage=m;if(p<1&&!introDone)requestAnimationFrame(iris);else bg.style.display='none'};
  bg.style.webkitMaskImage=bg.style.maskImage='radial-gradient(circle at 50% 50%, transparent 0px, #000 1px)';requestAnimationFrame(iris);
  later2(()=>{introDone=true},2800);
  $('#intro').addEventListener('pointerdown',e=>{if(!introDone&&!e.target.closest('button')){introAnims.forEach(a=>a.finish());$('#inT2').classList.add('gl');introDone=true;bg.style.display='none'}})}
function closeIntro(then){introDone=true;TO2.forEach(clearTimeout);introAnims.forEach(a=>a.finish());$('#inBg').style.display='none';
  const t1=$('#inT1'),a=t1.getBoundingClientRect(),b=$('#logo span').getBoundingClientRect();
  t1.animate([{transform:'none',opacity:1},{transform:`translate(${b.left-a.left}px,${b.top-a.top}px) scale(${b.height/a.height})`,opacity:0}],{duration:750,easing:'cubic-bezier(.7,0,.2,1)',fill:'forwards'});
  [...document.querySelectorAll('#inFg>*:not(#inT1)')].forEach((el,i)=>el.animate([{opacity:getComputedStyle(el).opacity,transform:'none'},{opacity:0,transform:'translateY(-14px)'}],{duration:420,delay:i*30,fill:'forwards',easing:'ease-in'}));
  setTimeout(()=>{$('#intro').style.display='none';then()},700)}
$('#bStart').onclick=()=>closeIntro(()=>{$('#hud').classList.add('on');$('#box').classList.remove('off');goStep(0)});

$('#hFull').onclick=()=>toggleFull();$('#hSound').onclick=()=>toggleSound();
function toggleFull(){if(document.fullscreenElement)document.exitFullscreen();else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen()}
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,select,button')&&(e.key===' '||e.key==='Enter'))return;if(e.target.closest&&e.target.closest('input,select'))return;const k=e.key;
  if(k==='f'||k==='F')toggleFull();else if(k==='s'||k==='S')toggleSound();
  else if(MODE==='story'){if(k==='ArrowRight'||k===' '){e.preventDefault();if(TYPE)finishType();else goStep(STEP+1)}else if(k==='ArrowLeft')goStep(STEP-1)}});

/* ---------- the ending: a 3-line recap ---------- */
async function startOutro(){MODE='outro';clearLater();stopPlay();clearOverlays();showGlobe(false);$('#box').classList.add('off');$('#bigYear').style.display='none';
  team=SPEC_TEAM.slice();setAll({world:0,dim:0,graph:0,team:1,markers:1,eq:0,lineup:0,cut:0,wobble:0});
  const O=$('#outro'),S=$('#otStage');O.classList.add('on');S.innerHTML='';$('#oBtns').classList.remove('on');
  const beat=714,wait=ms=>new Promise(r=>setTimeout(r,ms)),E='cubic-bezier(.2,1.3,.3,1)';
  let lo=6,hi=24;if(DATA){const rs=DATA.meta.years.map(y=>ratioOf(DATA.frames[String(y)]));lo=Math.floor(Math.min(...rs));hi=Math.round(Math.max(...rs))}
  const rc=document.createElement('div');rc.className='recap';rc.innerHTML=`<div><b class="n">1</b><span>Draw the network: dots, and lines between the dots that trade.</span></div><div><b class="n">2</b><span>Shake it. The slowest wobble pulls the teams apart.</span></div><div><b class="n">3</b><span>Check a shuffled copy. Real teams beat luck: <span class="w">${RATIO_V.toFixed(1)}×</span> in the village, <span class="w">${lo}× to ${hi}×</span> in the real arms trade.</span></div>`;
  S.appendChild(rc);[...rc.children].forEach((d,i)=>d.animate([{opacity:0,transform:'translateX(-30px)'},{opacity:1,transform:'none'}],{duration:600,delay:i*beat,easing:E,fill:'forwards'}));
  await wait(beat*3+500);$('#oBtns').classList.add('on')}
const closeOutro=()=>{$('#outro').classList.remove('on');$('#box').classList.remove('off');STEP=-1};
$('#oMap').onclick=()=>{closeOutro();goStep(5)};
$('#oAgain').onclick=()=>{closeOutro();goStep(0)};

/* =====================================================================
   SOUND (optional, synthesised — no audio files): rain, fire, thunder
   ===================================================================== */
let AU=null;
function toggleSound(){const b=$('#hSound');
  if(!AU){try{AU=makeAudio()}catch(e){return}}else{AU.on=!AU.on;AU.master.gain.setTargetAtTime(AU.on?.9:0,AU.ac.currentTime,.4)}
  b.textContent=AU.on?'🔊 Sound on':'🔈 Sound off'}
function makeAudio(){const ac=new(window.AudioContext||window.webkitAudioContext)(),master=ac.createGain();master.gain.value=0;master.connect(ac.destination);
  const buf=(sec,fn)=>{const b=ac.createBuffer(1,ac.sampleRate*sec|0,ac.sampleRate);fn(b.getChannelData(0));return b};
  const filt=(type,f,q=.7)=>{const x=ac.createBiquadFilter();x.type=type;x.frequency.value=f;x.Q.value=q;return x};
  const loop=(b,nodes,gain)=>{const s=ac.createBufferSource();s.buffer=b;s.loop=true;let n=s;for(const x of nodes){n.connect(x);n=x}const gn=ac.createGain();gn.gain.value=gain;n.connect(gn);gn.connect(master);s.start();return gn};
  loop(buf(4,d=>{let b0=0,b1=0,b2=0;for(let i=0;i<d.length;i++){const w=Math.random()*2-1;b0=.99765*b0+w*.099;b1=.963*b1+w*.2965;b2=.57*b2+w*1.0526;d[i]=(b0+b1+b2+w*.1848)*.11}}),[filt('lowpass',2600),filt('highpass',300)],.55);
  loop(buf(3,d=>{for(let k=0;k<60;k++){const p=Math.random()*(d.length-500)|0,a=.2+Math.random()*.8,len=30+Math.random()*260|0;for(let j=0;j<len;j++)d[p+j]+=(Math.random()*2-1)*a*Math.exp(-j/(len*.22))}}),[filt('bandpass',1900,.8)],.4);
  const wind=loop(buf(5,d=>{let l=0;for(let i=0;i<d.length;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3.2}}),[filt('lowpass',420)],.22);
  const lfo=ac.createOscillator(),lg=ac.createGain();lfo.frequency.value=.06;lg.gain.value=.12;lfo.connect(lg);lg.connect(wind.gain);lfo.start();
  master.gain.setTargetAtTime(.9,ac.currentTime,.6);
  const burst=(dur,f,gain,delay=0,type='lowpass')=>{const s=ac.createBufferSource();s.buffer=buf(dur,d=>{for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2)});const fl=filt(type,f),gn=ac.createGain();gn.gain.value=gain;s.connect(fl);fl.connect(gn);gn.connect(master);s.start(ac.currentTime+delay)};
  const tone=(f,dur,gain,type='triangle',delay=0)=>{const o=ac.createOscillator(),gn=ac.createGain(),t=ac.currentTime+delay;o.type=type;o.frequency.value=f;gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(gain,t+.01);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(gn);gn.connect(master);o.start(t);o.stop(t+dur+.05)};
  return{ac,master,on:true,thunder:()=>burst(3,140,.9,1.1),zap:()=>{burst(.5,3000,.5,0,'highpass');burst(1.6,160,.8,.05)},blip:t=>tone(t?523:392,.18,.1),chime:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.5,.1,'triangle',i*.09))}}

/* =====================================================================
   BOOT
   ===================================================================== */
buildSky();buildClouds();buildFar();buildHills();buildFore();buildVignette();buildGlows();buildHouses();buildSprites();
fit();new ResizeObserver(()=>sizeGlobe()).observe($('#box'));
// load the data, then quietly build the globe in the background so step 7 opens instantly
fetch('data.json').then(r=>r.json()).then(d=>{DATA=d;setTimeout(()=>ensureGlobe().catch(()=>{}),2500)}).catch(()=>{});
requestAnimationFrame(frame);
if(Q.has('step')){$('#intro').style.display='none';$('#hud').classList.add('on');$('#box').classList.remove('off');goStep(clamp((+Q.get('step')||1)-1,0,7))}
else(document.fonts?Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]):Promise.resolve()).then(runIntro);
</script>
